<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Jarvis do Dia</title>
<style>
  /* Layout: coluna única, cabeçalho com saudação, clima, cotações em grade 2x2, notícias por abas, bolinha flutuante para atualizar */
  :root {
    --bg: #0a1020; --surface: #111a2e; --surface-2: #16223b; --line: #22304f;
    --txt: #e9eefb; --mute: #8d9dc4; --accent: #35c6ff; --up: #3ddc97; --down: #ff6b7a; --warn: #ffc857;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); }
  body {
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 15px; line-height: 1.4;
  }
  main { max-width: 640px; margin: 0 auto; }

  header { padding: 22px 2px 14px; }
  .periodo { display: inline-block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { margin: 4px 0 2px; font-size: 28px; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
  .data { color: var(--mute); font-size: 14px; }

  section { margin-top: 22px; }
  h2 { margin: 0 0 10px 2px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 600; }

  .clima { background: linear-gradient(140deg, #14407a 0%, #14233f 70%); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
  .clima-topo { display: flex; align-items: center; gap: 14px; }
  .clima-ico { font-size: 54px; line-height: 1; }
  .clima-temp { font-size: 44px; font-weight: 650; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .clima-desc { color: #b9c8ea; font-size: 14px; margin-top: 4px; }
  .clima-det { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 13px; color: #b9c8ea; font-variant-numeric: tabular-nums; }
  .dias { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .dia { background: rgba(255,255,255,.07); border-radius: 12px; padding: 10px 6px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
  .dia b { display: block; font-weight: 600; margin-bottom: 2px; }
  .dia .chuva { color: var(--accent); }

  .moedas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .moeda { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
  .moeda .nome { font-size: 13px; color: var(--mute); }
  .moeda .valor { font-size: 21px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .moeda .var { font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }

  .moeda { text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .moeda[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); box-shadow: 0 0 0 1px var(--accent) inset; }

  .grafico { margin-top: 12px; }
  .graf { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 14px 12px; }
  .graf-topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 0 4px; }
  .graf-nome { font-size: 13px; color: var(--mute); }
  .graf-valor { font-size: 28px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .graf-var { font-size: 14px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .graf-var small { display: block; font-weight: 400; color: var(--mute); font-size: 12px; }
  .graf-area { position: relative; margin-top: 14px; height: 190px; touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  .graf-area svg { display: block; width: 100%; height: 100%; color: var(--c); overflow: visible; }
  .graf-area .grade { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 3 4; }
  .graf-area .linha { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .graf-area .rotulo { position: absolute; left: 4px; font-size: 11px; color: var(--mute); background: rgba(10,16,32,.7); border-radius: 6px; padding: 1px 5px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .graf-area .rotulo.max { top: 2px; } .graf-area .rotulo.min { bottom: 2px; }
  .cursor { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--mute); pointer-events: none; }
  .cursor i { position: absolute; left: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); border: 2px solid var(--bg); margin-top: -5px; }
  .graf-datas { display: flex; justify-content: space-between; padding: 8px 4px 0; font-size: 12px; color: var(--mute); }
  .periodos { display: flex; gap: 8px; margin-top: 12px; }
  .periodo-btn { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--mute); border-radius: 10px; padding: 8px 0; font: inherit; font-size: 13px; cursor: pointer; }
  .periodo-btn[aria-pressed="true"] { background: var(--surface-2); color: var(--txt); border-color: var(--accent); font-weight: 600; }
  .aviso small { display: block; margin-top: 6px; color: var(--mute); font-size: 11px; overflow-wrap: anywhere; }

  .abas { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px; scrollbar-width: none; }
  .abas::-webkit-scrollbar { display: none; }
  .aba { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--mute); border-radius: 999px; padding: 9px 15px; font: inherit; font-size: 14px; cursor: pointer; }
  .aba[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }

  .noticias { display: flex; flex-direction: column; gap: 10px; }
  .noticia { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .noticia:active { background: var(--surface-2); }
  .noticia .t { font-size: 16px; line-height: 1.35; font-weight: 550; text-wrap: pretty; }
  .noticia .f { margin-top: 8px; font-size: 12px; color: var(--mute); }

  .aviso { color: var(--mute); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 14px; font-size: 14px; }
  .aviso.erro { color: var(--warn); border-color: #5a4a22; }
  .aviso button { margin-left: 8px; background: none; border: 0; color: var(--accent); font: inherit; text-decoration: underline; padding: 0; cursor: pointer; }

  .esq { background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 300% 100%; animation: brilho 1.4s linear infinite; border-radius: 16px; border: 1px solid var(--line); height: 74px; }
  .esq.alto { height: 150px; }
  @keyframes brilho { from { background-position: 100% 0; } to { background-position: 0 0; } }

  .coach { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 18px 14px; }
  .coach-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .coach-cat { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: #04121f; background: var(--accent); border-radius: 999px; padding: 4px 10px; }
  .coach-data { font-size: 12px; color: var(--mute); }
  .coach-frase { margin: 14px 0 0; font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
  .coach-pratica { margin: 12px 0 0; font-size: 15px; line-height: 1.5; color: #c4d0ec; text-wrap: pretty; }
  .coach-pratica b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 600; margin-bottom: 4px; }
  .coach-acoes { display: flex; gap: 8px; margin-top: 16px; }
  .coach-acoes button, .coach-fav-lista button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--txt); border-radius: 12px; padding: 11px 8px; font: inherit; font-size: 14px; cursor: pointer; }
  .coach-acoes button:active { background: var(--surface-2); }
  .coach-acoes button[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
  .coach-acoes .principal { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  .coach-favs { margin-top: 12px; }
  .coach-favs > button { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; padding: 6px 0; cursor: pointer; }
  .coach-fav-lista { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .coach-fav-item { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; line-height: 1.4; }
  .coach-fav-item span { flex: 1; min-width: 0; }
  .coach-fav-item button { flex: 0 0 auto; padding: 6px 10px; font-size: 12px; color: var(--mute); }
  .rodape { margin-top: 26px; text-align: center; color: var(--mute); font-size: 12px; line-height: 1.6; }

  /* bolinha flutuante */
  .orb {
    position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: 64px; height: 64px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; z-index: 5;
    background: radial-gradient(circle at 35% 30%, #7df3ff 0%, #1aa7ff 42%, #0a2a6b 100%);
    box-shadow: 0 0 18px 3px rgba(40,190,255,.55), inset 0 0 12px rgba(255,255,255,.35);
    animation: respira 3.2s ease-in-out infinite;
  }
  .orb::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 2px solid transparent; border-top-color: rgba(255,255,255,.9); border-right-color: rgba(255,255,255,.25); animation: gira 2.4s linear infinite; }
  .orb::after { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: radial-gradient(circle, #fff, #8be9ff 60%, transparent 100%); }
  .orb.busy::before { animation-duration: .7s; }
  @keyframes respira { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes gira { to { transform: rotate(360deg); } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .orb, .orb::before, .esq { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="periodo" id="periodo">Resumo do dia</span>
    <h1 id="saudacao">Olá!</h1>
    <div class="data" id="data"></div>
  </header>

  <section aria-labelledby="h-clima">
    <h2 id="h-clima">Clima em Varginha</h2>
    <div id="clima"><div class="esq alto"></div></div>
  </section>

  <section aria-labelledby="h-coach">
    <h2 id="h-coach">Coach do dia</h2>
    <div id="coach"></div>
  </section>

  <section aria-labelledby="h-moedas">
    <h2 id="h-moedas">Dólar, euro e cripto</h2>
    <div id="moedas" class="moedas"><div class="esq"></div><div class="esq"></div><div class="esq"></div><div class="esq"></div></div>
    <div id="grafico" class="grafico"></div>
  </section>

  <section aria-labelledby="h-noticias">
    <h2 id="h-noticias">Notícias</h2>
    <div class="abas" id="abas" role="tablist" aria-label="Temas"></div>
    <div class="noticias" id="noticias"><div class="esq"></div><div class="esq"></div><div class="esq"></div></div>
  </section>

  <p class="rodape" id="rodape"></p>
</main>

<button class="orb" id="orb" aria-label="Atualizar agora" title="Atualizar agora"></button>

<script>
(() => {
  const CFG = {
    cidade: 'Varginha, MG',
    lat: -21.5514, lon: -45.4303,
    porTema: 5,
    moedas: ['USD-BRL', 'EUR-BRL', 'BTC-BRL', 'ETH-BRL'],
    rotulos: { USD: 'Dólar', EUR: 'Euro', BTC: 'Bitcoin', ETH: 'Ethereum' },
    temas: [
      { id: 'tecnologia', titulo: 'Tecnologia', busca: 'tecnologia', gdelt: 'tecnologia', feeds: [
        { url: 'GOOGLE' },
        { nome: 'Tecmundo', url: 'https://rss.tecmundo.com.br/feed' },
        { nome: 'Olhar Digital', url: 'https://olhardigital.com.br/feed/' } ] },
      { id: 'jogos', titulo: 'Jogos', busca: 'games videogames', gdelt: 'games', feeds: [
        { url: 'GOOGLE' },
        { nome: 'IGN Brasil', url: 'https://br.ign.com/feed.xml' },
        { nome: 'Jovem Nerd', url: 'https://jovemnerd.com.br/feed/' } ] },
      { id: 'economia', titulo: 'Economia', busca: 'economia Brasil mercado', gdelt: 'economia mercado', feeds: [
        { url: 'GOOGLE' },
        { nome: 'InfoMoney', url: 'https://www.infomoney.com.br/feed/' },
        { nome: 'Exame', url: 'https://exame.com/feed/' } ] },
      { id: 'politica', titulo: 'Presidente e governo', busca: 'Presidente da República governo federal', gdelt: 'presidente governo', feeds: [
        { url: 'GOOGLE' },
        { nome: 'Agência Brasil', url: 'https://agenciabrasil.ebc.com.br/rss/politica/feed.xml' },
        { nome: 'Agência Brasil', url: 'https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml' } ] },
    ],
    staleMin: 20,
  };

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dec = (s) => { const t = document.createElement('textarea'); t.innerHTML = String(s ?? ''); return t.value; };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sem armazenamento */ } },
  };
  const brl = (n) => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: n < 100 ? 2 : 0, maximumFractionDigits: n < 100 ? 2 : 0 });

  let dados = store.get('jarvis:dados') || { t: 0, clima: null, cot: null, news: {} };
  let aba = store.get('jarvis:aba') || CFG.temas[0].id;
  let carregando = false;
  let falhas = {};

  /* ----------------------------- rede ----------------------------- */
  async function http(url, tipo = 'json', ms = 12000) {
    const c = new AbortController();
    const to = setTimeout(() => c.abort(), ms);
    try {
      const r = await fetch(url, { signal: c.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return tipo === 'json' ? await r.json() : await r.text();
    } finally { clearTimeout(to); }
  }

  async function getCotacoes() {
    const j = await http('https://economia.awesomeapi.com.br/json/last/' + CFG.moedas.join(','));
    return CFG.moedas.map((p) => j[p.replace('-', '')]).filter(Boolean).map((c) => ({
      codigo: c.code, nome: CFG.rotulos[c.code] || c.name.split('/')[0], valor: +c.bid, var: +c.pctChange,
    }));
  }

  const WMO = {
    0: ['Céu limpo', '☀️'], 1: ['Quase limpo', '🌤️'], 2: ['Parcialmente nublado', '⛅'], 3: ['Nublado', '☁️'],
    45: ['Neblina', '🌫️'], 48: ['Neblina', '🌫️'], 51: ['Garoa fraca', '🌦️'], 53: ['Garoa', '🌦️'], 55: ['Garoa forte', '🌧️'],
    61: ['Chuva fraca', '🌦️'], 63: ['Chuva', '🌧️'], 65: ['Chuva forte', '🌧️'],
    80: ['Pancadas de chuva', '🌦️'], 81: ['Pancadas fortes', '🌧️'], 82: ['Pancadas violentas', '⛈️'],
    95: ['Tempestade', '⛈️'], 96: ['Tempestade com granizo', '⛈️'], 99: ['Tempestade com granizo', '⛈️'],
  };

  async function getClima() {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}` +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,weather_code' +
      '&timezone=America%2FSao_Paulo&forecast_days=3';
    const j = await http(u);
    const [descricao, icone] = WMO[j.current.weather_code] || ['—', '🌡️'];
    return {
      temp: Math.round(j.current.temperature_2m), sensacao: Math.round(j.current.apparent_temperature),
      umidade: j.current.relative_humidity_2m, vento: Math.round(j.current.wind_speed_10m), descricao, icone,
      nascer: j.daily.sunrise[0].slice(11, 16), porDoSol: j.daily.sunset[0].slice(11, 16),
      dias: j.daily.time.map((d, i) => ({
        data: d, max: Math.round(j.daily.temperature_2m_max[i]), min: Math.round(j.daily.temperature_2m_min[i]),
        chuva: j.daily.precipitation_probability_max[i] ?? 0, icone: (WMO[j.daily.weather_code[i]] || ['', '🌡️'])[1],
      })),
    };
  }

  function normaliza(titulo, link, data, fonte, fixa) {
    titulo = dec(titulo).trim();
    if (fixa) return { titulo, link, fonte: fixa, data };
    if (!fonte) {
      const i = titulo.lastIndexOf(' - ');
      if (i > 0) { fonte = titulo.slice(i + 3); titulo = titulo.slice(0, i); }
    } else if (titulo.endsWith(' - ' + fonte)) {
      titulo = titulo.slice(0, -(fonte.length + 3));
    }
    return { titulo, link, fonte: dec(fonte || ''), data };
  }

  /* Notícias: um tema por vez (os serviços gratuitos bloqueiam muitos pedidos juntos).
     Para cada tema tenta o Google Notícias e depois portais; cada fonte passa pelo rss2json
     e, se falhar, por proxies; no fim tenta a GDELT. */
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const PROXIES = [
    ['allorigins', (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)],
    ['codetabs', (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)],
    ['thingproxy', (u) => 'https://thingproxy.freeboard.io/fetch/' + u],
  ];

  function lerRSS(xml, fixa) {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    let itens = [...doc.querySelectorAll('item')];
    const atom = !itens.length;
    if (atom) itens = [...doc.querySelectorAll('entry')];
    itens = itens.slice(0, CFG.porTema);
    if (!itens.length) throw new Error('feed sem itens');
    return itens.map((it) => {
      const txt = (q) => it.querySelector(q)?.textContent || '';
      const link = atom ? (it.querySelector('link')?.getAttribute('href') || '') : txt('link');
      return normaliza(txt('title'), link, txt('pubDate') || txt('updated') || txt('published'), txt('source'), fixa);
    });
  }

  async function viaRss2json(feed, fixa) {
    const j = await http('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed), 'json', 9000);
    if (j.status !== 'ok' || !j.items || !j.items.length) throw new Error('rss2json: ' + (j.message || 'sem itens'));
    return j.items.slice(0, CFG.porTema).map((i) => normaliza(i.title, i.link, i.pubDate, '', fixa));
  }

  async function viaProxy([nome, montar], feed, fixa) {
    try { return lerRSS(await http(montar(feed), 'text', 9000), fixa); }
    catch (e) { throw new Error(nome + ': ' + e.message); }
  }

  async function lerFeed(feed, fixa) {
    try { return await viaRss2json(feed, fixa); }
    catch (e1) {
      try { return await Promise.any(PROXIES.map((p) => viaProxy(p, feed, fixa))); }
      catch (e2) { throw new Error([e1.message, ...(e2.errors || [e2]).map((x) => x.message)].join(' · ')); }
    }
  }

  async function viaGdelt(tema) {
    await sleep(5200); // a GDELT aceita ~1 pedido a cada 5 segundos
    const q = encodeURIComponent(`${tema.gdelt || tema.busca} sourcelang:portuguese sourcecountry:brazil`);
    const j = await http(`https://api.gdeltproject.org/api/v2/doc/doc?query=${q}&mode=artlist&maxrecords=${CFG.porTema}&format=json&timespan=2d&sort=datedesc`);
    if (!j.articles || !j.articles.length) throw new Error('gdelt: sem itens');
    return j.articles.slice(0, CFG.porTema).map((a) => {
      const s = a.seendate || '';
      const iso = /^\d{8}T\d{6}Z$/.test(s) ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}T${s.slice(9, 11)}:${s.slice(11, 13)}:${s.slice(13, 15)}Z` : '';
      return { titulo: dec(a.title).trim(), link: a.url, fonte: a.domain || '', data: iso };
    });
  }

  async function getNoticias(tema) {
    const erros = [];
    for (const f of tema.feeds) {
      const url = f.url === 'GOOGLE'
        ? `https://news.google.com/rss/search?q=${encodeURIComponent(tema.busca + ' when:2d')}&hl=pt-BR&gl=BR&ceid=BR:pt-419`
        : f.url;
      try {
        const lista = await lerFeed(url, f.nome);
        if (lista.length) return lista;
      } catch (e) { erros.push((f.nome || 'Google') + ' → ' + e.message); }
    }
    try { return await viaGdelt(tema); } catch (e) { erros.push(e.message); }
    throw new Error(erros.join(' | '));
  }

  /* Histórico para o gráfico de área */
  async function getHistorico(par, n) {
    const j = await http(`https://economia.awesomeapi.com.br/json/daily/${par}/${n}`);
    const pts = j.map((x) => ({ t: +x.timestamp * 1000, v: +x.bid })).filter((p) => p.v > 0).reverse();
    if (pts.length < 2) throw new Error('histórico curto');
    return pts;
  }

  async function carregar() {
    if (carregando) return;
    carregando = true; $('#orb').classList.add('busy');
    const [cot, clima] = await Promise.allSettled([getCotacoes(), getClima()]);
    falhas = { cot: cot.status === 'rejected', clima: clima.status === 'rejected' };
    if (cot.status === 'fulfilled') dados.cot = cot.value;
    if (clima.status === 'fulfilled') dados.clima = clima.value;
    if (cot.status === 'fulfilled' || clima.status === 'fulfilled') dados.t = Date.now();
    store.set('jarvis:dados', dados);
    render();
    carregarGrafico();

    // notícias: a aba aberta primeiro, depois as outras, uma de cada vez
    const ordem = [aba, ...CFG.temas.map((t) => t.id).filter((id) => id !== aba)];
    for (const id of ordem) {
      const tema = CFG.temas.find((t) => t.id === id);
      try { dados.news[id] = await getNoticias(tema); falhas[id] = false; dados.t = Date.now(); }
      catch (e) { falhas[id] = e.message || 'erro'; }
      store.set('jarvis:dados', dados);
      renderNoticias();
      $('#rodape').innerHTML = rodapeHTML();
      await sleep(700);
    }
    carregando = false; $('#orb').classList.remove('busy');
  }

  function rodapeHTML() {
    return dados.t
      ? `Atualizado às ${new Date(dados.t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}<br>Cotações: AwesomeAPI · Clima: Open-Meteo · Notícias: Google Notícias e portais`
      : '';
  }

  /* --------------------------- gráfico --------------------------- */
  let moedaSel = store.get('jarvis:moeda') || 'USD-BRL';
  let dias = store.get('jarvis:dias') || 30;
  let erroGraf = false;
  const hist = {};
  const PERIODOS = [[7, '7D'], [30, '30D'], [90, '90D'], [180, '6M']];

  async function carregarGrafico() {
    const par = moedaSel, n = dias, chave = par + '|' + n;
    const cache = store.get('jarvis:h:' + chave);
    if (cache && cache.pts && !hist[chave]) { hist[chave] = cache.pts; desenhar(); }
    try {
      hist[chave] = await getHistorico(par, n);
      store.set('jarvis:h:' + chave, { pts: hist[chave] });
      erroGraf = false;
    } catch { erroGraf = !hist[chave]; }
    if (par === moedaSel && n === dias) desenhar();
  }

  function nomeMoeda(par) {
    const cod = par.split('-')[0];
    return CFG.rotulos[cod] || cod;
  }
  const fmtData = (t) => new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
  const fmtPct = (p) => Math.abs(p).toFixed(2).replace('.', ',') + '%';

  function desenhar() {
    const box = $('#grafico');
    const pts = hist[moedaSel + '|' + dias];
    if (!pts) {
      box.innerHTML = erroGraf
        ? '<div class="aviso erro">Não consegui carregar o gráfico. <button data-act="reload">Tentar de novo</button></div>'
        : '<div class="esq alto"></div>';
      return;
    }
    const W = 640, H = 220;
    const vals = pts.map((p) => p.v);
    const min = Math.min(...vals), max = Math.max(...vals);
    const pad = ((max - min) || max * 0.01) * 0.12;
    const lo = min - pad, hi = max + pad;
    const X = (i) => (i / (pts.length - 1)) * W;
    const Y = (v) => H - ((v - lo) / (hi - lo)) * H;
    const linha = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    const ultimo = vals[vals.length - 1], primeiro = vals[0];
    const sobe = ultimo >= primeiro;
    const pct = (ultimo / primeiro - 1) * 100;
    const rot = PERIODOS.find((p) => p[0] === dias)?.[1] || dias + 'D';
    box.innerHTML = `<div class="graf" style="--c:var(${sobe ? '--up' : '--down'})">
      <div class="graf-topo">
        <div><div class="graf-nome" id="gn">${esc(nomeMoeda(moedaSel))} em reais</div><div class="graf-valor" id="gv">${brl(ultimo)}</div></div>
        <div class="graf-var ${sobe ? 'up' : 'down'}">${sobe ? '▲' : '▼'} ${fmtPct(pct)}<small>nos últimos ${esc(rot)}</small></div>
      </div>
      <div class="graf-area" id="ga">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".38"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
          <line class="grade" x1="0" x2="${W}" y1="${H * .25}" y2="${H * .25}"/><line class="grade" x1="0" x2="${W}" y1="${H * .5}" y2="${H * .5}"/><line class="grade" x1="0" x2="${W}" y1="${H * .75}" y2="${H * .75}"/>
          <path d="${linha} L${W},${H} L0,${H} Z" fill="url(#gr)"/>
          <path class="linha" d="${linha}"/>
        </svg>
        <span class="rotulo max">${brl(max)}</span><span class="rotulo min">${brl(min)}</span>
        <div class="cursor" id="cur" hidden><i id="dot"></i></div>
      </div>
      <div class="graf-datas"><span id="d1">${fmtData(pts[0].t)}</span><span id="d2">${fmtData(pts[pts.length - 1].t)}</span></div>
      <div class="periodos">${PERIODOS.map(([n, r]) => `<button class="periodo-btn" data-dias="${n}" aria-pressed="${n === dias}">${r}</button>`).join('')}</div>
    </div>`;

    const area = $('#ga'), cur = $('#cur'), dot = $('#dot'), gv = $('#gv'), d2 = $('#d2');
    const reset = () => { cur.hidden = true; gv.textContent = brl(ultimo); d2.textContent = fmtData(pts[pts.length - 1].t); };
    const mover = (e) => {
      const r = area.getBoundingClientRect();
      const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      const i = Math.round(f * (pts.length - 1));
      cur.hidden = false;
      cur.style.left = (i / (pts.length - 1)) * 100 + '%';
      dot.style.top = (Y(pts[i].v) / H) * 100 + '%';
      gv.textContent = brl(pts[i].v);
      d2.textContent = fmtData(pts[i].t);
    };
    area.addEventListener('pointerdown', (e) => { try { area.setPointerCapture(e.pointerId); } catch { /* ok */ } mover(e); });
    area.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) mover(e); });
    area.addEventListener('pointerup', reset);
    area.addEventListener('pointercancel', reset);
    area.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') reset(); });
  }

  /* --------------------------- exibição --------------------------- */
  function parseData(s) {
    if (!s) return null;
    if (/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(s)) s = s.replace(' ', 'T') + 'Z'; // rss2json entrega em UTC
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  function relativo(s) {
    const d = parseData(s); if (!d) return '';
    const min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 1) return 'agora';
    if (min < 60) return `há ${min} min`;
    const h = Math.round(min / 60);
    return h < 24 ? `há ${h} h` : `há ${Math.round(h / 24)} d`;
  }
  const hhmm = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  function periodo() {
    const h = new Date().getHours();
    const sol = dados.clima && dados.clima.porDoSol;
    if (sol && hhmm() >= sol) return ['Boa noite', 'Resumo do anoitecer'];
    if (h < 12) return ['Bom dia', 'Resumo da manhã'];
    if (h < 18) return ['Boa tarde', 'Resumo da tarde'];
    return ['Boa noite', 'Resumo do anoitecer'];
  }

  const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  function renderClima() {
    const c = dados.clima;
    if (!c) {
      $('#clima').innerHTML = falhas.clima
        ? '<div class="aviso erro">Não consegui carregar o clima. <button data-act="reload">Tentar de novo</button></div>'
        : '<div class="esq alto"></div>';
      return;
    }
    const dias = c.dias.map((d, i) => `<div class="dia"><b>${i === 0 ? 'Hoje' : DIAS[new Date(d.data + 'T12:00:00').getDay()]}</b>${d.icone}<br>${d.min}° / ${d.max}°<br><span class="chuva">💧 ${d.chuva}%</span></div>`).join('');
    $('#clima').innerHTML = `<div class="clima">
      <div class="clima-topo"><div class="clima-ico">${c.icone}</div>
        <div><div class="clima-temp">${c.temp}°C</div><div class="clima-desc">${esc(c.descricao)} · sensação ${c.sensacao}°</div></div></div>
      <div class="clima-det"><span>💧 ${c.umidade}%</span><span>🌬️ ${c.vento} km/h</span><span>🌅 ${c.nascer}</span><span>🌇 ${c.porDoSol}</span></div>
      <div class="dias">${dias}</div></div>`;
  }

  function renderMoedas() {
    const l = dados.cot;
    if (!l) {
      $('#moedas').innerHTML = falhas.cot
        ? '<div class="aviso erro" style="grid-column:1/-1">Não consegui carregar as cotações. <button data-act="reload">Tentar de novo</button></div>'
        : '<div class="esq"></div><div class="esq"></div><div class="esq"></div><div class="esq"></div>';
      return;
    }
    $('#moedas').innerHTML = l.map((m) => {
      const sobe = m.var >= 0;
      const par = m.codigo + '-BRL';
      return `<button class="moeda" data-par="${esc(par)}" aria-pressed="${par === moedaSel}"><div class="nome">${esc(m.nome)}</div><div class="valor">${brl(m.valor)}</div>
        <div class="var ${sobe ? 'up' : 'down'}">${sobe ? '▲' : '▼'} ${Math.abs(m.var).toFixed(2).replace('.', ',')}% hoje</div></button>`;
    }).join('');
  }

  function renderAbas() {
    $('#abas').innerHTML = CFG.temas.map((t) =>
      `<button class="aba" role="tab" id="aba-${t.id}" data-aba="${t.id}" aria-selected="${t.id === aba}">${esc(t.titulo)}</button>`).join('');

  function renderNoticias() {
    const lista = dados.news[aba];
    const box = $('#noticias');
    if (!lista) {
      box.innerHTML = falhas[aba]
        ? `<div class="aviso erro">Não consegui carregar essas notícias. <button data-act="reload">Tentar de novo</button><small>${esc(String(falhas[aba]).slice(0, 400))}</small></div>`
        : '<div class="esq"></div><div class="esq"></div><div class="esq"></div>';
      return;

    if (!lista.length) { box.innerHTML = '<div class="aviso">Nada novo nas últimas 24 horas.</div>'; return; }
    box.innerHTML = lista.map((n) => `<a class="noticia" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">

      <div class="f">${esc(n.fonte)}${n.fonte && n.data ? ' · ' : ''}${esc(relativo(n.data))}</div></a>`).join('');

esposta."],["Negociação","Quem tem pressa de fechar, cede.","Quando você mostra que precisa muito do acordo, entrega o poder. Tenha alternativas e tempo. Quem pode ir embora negocia melhor do que quem não pode."],["Negociação","Nunca aceite a primeira oferta na hora.","Mesmo que seja boa, responda: “Obrigado, vou analisar e te retorno”. A primeira oferta quase sempre tem margem. Um dia de espera não custa nada e pode render muito."],["Negociação","Quem pergunta mais controla a conversa.","Perguntas revelam o que a outra parte quer, teme e precisa. Com isso, você propõe o que resolve o problema dela e ainda ganha. Pergunte antes de oferecer."],["Negociação","Chefe não paga por esforço. Paga por resultado que ele consegue enxergar.","Registre o que você entregou com números: economizou, vendeu, acelerou. Leve isso para a conversa do aumento. Quem chega com prova negocia de igual para igual."],["Negociação","Se você nunca ouve “não”, está pedindo pouco.","Um “não” educado raramente custa a sua vaga ou o negócio. Um “sim” pode mudar a sua renda por anos. Na próxima conversa, peça um pouco mais do que parece razoável."],["Negociação","Quem nunca pede desconto paga o preço cheio de tudo.","Pagar à vista, levar mais de um item, perguntar “tem uma condição melhor?”. A pergunta custa dez segundos. Teste na próxima compra."],["Negociação","Se a empresa não pode aumentar o salário, negocie o resto.","Bônus, horário flexível, dias de folga, cargo e curso pago também são dinheiro. Antes de ouvir “não”, pense no que mais melhoraria a sua vida."],["Carreira","O mercado não paga por quem trabalha mais. Paga por quem resolve o problema mais caro.","Horas trabalhadas não definem seu valor. O problema que você resolve define. Procure onde o problema é grande, raro e caro, e posicione-se ali."],["Carreira","E se, daqui a 12 meses, você fosse o mais preparado da sala?","Uma hora por dia em uma habilidade soma mais de 300 horas em um ano, muito mais do que a maioria investe. Escolha uma habilidade e deixe o tempo trabalhar para você."],["Carreira","Currículo bonito abre a porta. Prova de resultado fecha o negócio.","Projeto, número e resultado valem mais do que uma lista de cargos. Quem mostra o que já fez ganha de quem só diz o que sabe."],["Carreira","Se você é o mais inteligente do grupo, mude de grupo.","Crescimento vem de conviver com quem sabe mais. Procure ambientes onde você é o mais fraco em alguma coisa. É desconfortável, e é onde se aprende rápido."],["Carreira","A pessoa mais fácil de substituir é a que só faz o que mandam.","Quem antecipa problemas e traz soluções vira parte da decisão. Em toda reunião, leve uma ideia e um número."],["Carreira","Ninguém vai cuidar da sua carreira como você.","Defina onde quer estar daqui a dois anos e converse sobre isso com clareza. Quem não pede direção costuma receber a que sobrar."],["Carreira","Não espere ser notado. Torne o seu trabalho fácil de enxergar.","Mande um resumo curto das suas entregas toda semana. Sem arrogância, só fatos. Quem decide promoção lembra de quem aparece com resultado."],["Carreira","Seu primeiro emprego paga em dinheiro. O segundo deveria pagar também em aprendizado.","Antes de aceitar uma vaga, pergunte: o que vou saber fazer daqui a um ano que hoje não sei? Quem escolhe só pelo salário costuma estagnar."],["Hábitos","A motivação é a recepcionista. Quem faz o trabalho é o hábito.","A vontade vai e vem. Quem entrega é quem tem horário, lugar e gatilho. Faça o hábito acontecer logo depois de algo que você já faz, como depois do café."],["Hábitos","Todo mundo superestima o que faz em um dia e subestima o que faz em um ano.","Um passo pequeno parece nada hoje. Repetido por 365 dias, vira outra vida. Pare de esperar o dia perfeito e proteja a constância."],["Hábitos","Disciplina não é força de vontade. É ter tornado a decisão automática.","Quem treina todo dia não decide toda manhã se vai. Já decidiu. Remova a escolha: deixe a roupa separada, o horário marcado e o caminho livre."],["Hábitos","Nunca falhe duas vezes seguidas.","Perder um dia acontece. O que mata o hábito é um dia virar dois e depois uma semana. Se falhou hoje, o plano de amanhã é voltar, mesmo que na versão mínima."],["Hábitos","Primeiro você muda a rotina. Depois, a rotina muda você.","Não dá para querer outra vida e manter os mesmos dias. Troque uma coisa: acordar 30 minutos mais cedo, caminhar, estudar antes de dormir. Pequeno e mantido vira identidade."],["Hábitos","O dia começa na noite anterior.","Antes de dormir, escreva as três coisas mais importantes de amanhã. Você acorda já em movimento e gasta menos energia decidindo."],["Hábitos","Ler 20 páginas por dia dá cerca de 24 livros por ano.","São uns 30 a 40 minutos diários. Não depende de tempo livre, depende de rotina. Deixe o livro no lugar onde você costuma pegar o celular."],["Foco","O seu celular foi construído por gente muito inteligente para tirar o seu tempo.","Aplicativos ganham dinheiro com a sua atenção. Desligue as notificações que não são urgentes e tire da tela inicial o app que mais te rouba horas. Ou você decide para onde vai sua atenção, ou alguém decide por você."],["Foco","Se você não escolhe as suas prioridades, o mundo escolhe por você.","A caixa de mensagens é a lista de prioridades dos outros. Antes de abrir qualquer aplicativo, escreva as três coisas mais importantes do seu dia."],["Foco","Fazer várias coisas ao mesmo tempo é só trocar de tarefa muito rápido.","E cada troca custa atenção. Bloqueie 45 a 60 minutos para uma só tarefa difícil, sem celular. Quem consegue isso entrega em uma hora o que outros levam o dia inteiro."],["Foco","Seu tempo é a única coisa que você não recupera.","Dinheiro dá para ganhar de novo; tempo, não. Antes de aceitar algo, pergunte: vale gastar horas da minha vida nisso?"],["Foco","Dizer não ao que não importa é dizer sim ao que importa.","Cada compromisso aceito ocupa o lugar de outro. Se tudo é prioridade, nada é. Escolha poucas coisas e faça bem feitas."],["Mentalidade","E se o seu maior limite for só uma história que você repete?","Frases como “eu não levo jeito” viram verdade quando repetidas. Troque por “ainda não aprendi”. É uma mudança pequena que muda o que você tenta."],["Mentalidade","A única corrida que vale é contra quem você foi ontem.","Redes sociais mostram o melhor dos outros contra a sua rotina inteira. Compare com o seu ponto de partida e comemore o próprio avanço."],["Mentalidade","Você não está atrasado. Está comparando o seu capítulo 3 com o capítulo 20 de outra pessoa.","Cada um começa em um ponto e anda em um ritmo. O que importa é a direção. Olhe para onde você estava há um ano e confira."],["Mentalidade","O medo de começar mal custa anos.","Todo mundo que é bom hoje já fez mal feito um dia. Faça a versão ruim. Melhore na segunda."],["Mentalidade","Quem culpa os outros entrega o controle da própria vida.","Reconhecer a sua parte, mesmo quando não é a culpa toda, devolve a você o poder de mudar. Pergunte: o que eu poderia ter feito diferente?"],["Mentalidade","A zona de conforto é um ótimo lugar para descansar e um péssimo lugar para morar.","Tudo o que você quer está do lado de fora, no desconforto. Faça uma coisa por dia que te incomode um pouco: falar, pedir, treinar, tentar."],["Mentalidade","Os seus pensamentos não são fatos.","A cabeça inventa catástrofes com muita criatividade. Antes de acreditar, pergunte: que prova eu tenho? Qual seria a explicação mais simples?"],["Mentalidade","Sofrer antes da hora é pagar duas vezes.","Grande parte do que a gente teme nunca acontece. Prepare o plano B e pare de viver o problema antes de ele chegar."],["Mentalidade","O talento começa. A constância termina.","Quase todo mundo tem um ótimo começo. Quem chega é quem continua depois que a novidade acaba. Decida quanto tempo vai insistir antes de começar."],["Mentalidade","Diante de um incômodo, você só tem três opções: mudar, aceitar ou sair.","Reclamar é a quarta opção, e a única que não resolve nada. Escolha uma das três hoje."],["Mentalidade","Seu futuro já está sendo decidido, e por você.","Cada escolha pequena de hoje desenha a sua vida daqui a cinco anos. Diante de uma decisão, pergunte: isso me aproxima ou me afasta de onde quero estar?"],["Mentalidade","Comece antes de se sentir pronto.","Quem espera estar pronto nunca começa. Dê o primeiro passo imperfeito, aprenda com o resultado e melhore a segunda versão."],["Relações","Você não precisa ter razão. Precisa ter resultado.","Em discussão, quem vence a briga muitas vezes perde a pessoa. Pergunte: eu quero ganhar o argumento ou resolver o problema?"],["Relações","Quem fala muito aprende pouco. Quem escuta aprende e ainda é lembrado.","Na próxima conversa, deixe a pessoa terminar, faça uma pergunta sobre o que ela disse e só depois responda. Pouca gente faz isso, e todo mundo percebe."],["Relações","Cuidado com quem só aparece quando precisa.","Relações boas são de mão dupla. Observe quem te procura quando você não tem nada a oferecer. É nessas pessoas que vale investir tempo."],["Relações","Ser confiável é raro, e por isso vale ouro.","Quem entrega no prazo e responde o que combinou já está à frente de muita gente. Confiança se constrói em coisas pequenas e se perde nelas também."],["Relações","Em toda conversa difícil, comece por um ponto em comum.","Quando a outra pessoa sente que está do mesmo lado, ela escuta. Comece com “nós dois queremos que isso dê certo” antes do “mas”."],["Relações","Elogie em público, corrija em particular.","Reconhecimento aberto fortalece a pessoa. Correção aberta humilha. Falar a sós mantém o respeito e aumenta a chance de a mudança acontecer."],["Relações","Quem tem o que dizer não precisa de pressa.","Falar devagar transmite segurança e dá tempo de pensar. Respire antes de responder, principalmente quando estiver pressionado."],["Relações","Você é a média das pessoas com quem mais convive.","Passe mais tempo com quem estuda, trabalha e evolui. Você não precisa cortar ninguém, só aumentar a convivência com quem puxa para cima."],["Comunicação","Seja claro, não longo.","Comece pela conclusão, dê o motivo e termine dizendo o que você precisa da pessoa. Mensagem direta economiza o tempo de todo mundo."],["Comunicação","Dizer “não” com gentileza não é falta de educação. É respeito pelo seu tempo.","“Não consigo assumir isso agora” basta. Explicação longa abre espaço para insistência. Treine essa frase hoje."],["Saúde","Seu corpo é o único lugar onde você vai morar a vida inteira.","Você troca de casa, de emprego e de cidade, mas não de corpo. Cuidar dele é a base de qualquer outra meta. Comece pelo básico: dormir, mexer, comer melhor."],["Saúde","Quem dorme mal decide pior e nem percebe.","Sono curto prejudica o julgamento, o humor e a memória. Antes de pensar em produtividade, proteja o sono: horário fixo e sem tela na cama."],["Saúde","Você não precisa de uma hora de academia. Precisa de 20 minutos que realmente faça.","Pequeno e constante vence grande e esporádico. Caminhe 20 minutos hoje e repita amanhã."],["Saúde","O seu dia melhora ou piora nos primeiros 30 minutos.","Luz natural e um copo d’água antes de pegar o celular ajudam o corpo a acordar. Parece pouco e é o que muda o dia de muita gente."],["Saúde","Descansar também é trabalhar.","Pausas e sono mantêm a qualidade do que você produz. Quem trabalha esgotado erra mais e demora mais. Faça cinco minutos de intervalo a cada hora."],["Saúde","Cuidar da cabeça não é luxo.","Se você anda cansado, sem vontade e irritado há semanas, procure ajuda profissional. Falar com alguém é uma ação, não uma fraqueza."],["Decisões","E se a decisão que você adia há meses fosse só uma decisão que você já tomou?","Adiar é escolher não mudar, e isso também tem custo. Marque um prazo: até sexta eu decido. Mesmo uma decisão imperfeita destrava a sua vida."],["Decisões","Decisão pequena merece pressa. Decisão grande merece tempo.","Não gaste uma hora escolhendo algo que dá para trocar amanhã. Guarde a energia para o que não tem volta."],["Decisões","Antes de pedir conselho, descubra se a pessoa já fez o que você quer fazer.","Opinião de quem nunca fez custa caro. Procure quem já chegou onde você quer e pergunte o que faria diferente."],["Decisões","Decisão importante merece uma noite de sono.","Escolhas feitas com raiva, pressa ou euforia costumam virar arrependimento. Uma noite muda a perspectiva e não custa nada."],["Aprendizado","Quem ensina aprende duas vezes.","Explicar um assunto a alguém mostra onde você ainda não entendeu. É uma das formas mais rápidas de fixar o que você estuda."],["Aprendizado","Você aprende mais errando rápido do que acertando devagar.","Teste em pequeno, veja o resultado, ajuste. Cada erro barato é um curso gratuito."],["Aprendizado","Leia menos livros. Aplique mais.","Um livro aplicado vale mais do que dez lidos e esquecidos. Escolha uma ideia, ponha em prática esta semana e só depois passe para o próximo."],["Aprendizado","Informação todo mundo tem. O que falta é julgamento.","Hoje tudo está a uma busca de distância. Falta saber o que importa, o que é confiável e o que fazer. Treine isso lendo fontes diferentes e perguntando sempre: por quê?"],["Aprendizado","Educação financeira é um superpoder que a escola quase nunca ensina.","Juros, inflação e risco são conceitos simples e decisivos. Dedique 15 minutos por dia a aprender um deles. Em um mês, você enxerga o dinheiro de outro jeito."],["Aprendizado","Quem repete o que sempre fez recebe o que sempre recebeu.","Se você quer um resultado diferente, mude algo no processo. Escolha uma variável e teste por 30 dias."],["Aprendizado","Entenda o que você assina.","Contratos, financiamentos e planos têm custo total além da parcela. Pergunte quanto vai pagar no final e leia o que está em letra pequena."]];
  const mdc = (a, b) => (b ? mdc(b, a % b) : a);
  const PASSO = (() => { let n = 31; while (mdc(n, COACH.length) !== 1) n++; return n; })();
  const diaNum = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); };
  let coachSt = store.get('jarvis:coach') || {};
  if (!Array.isArray(coachSt.favs)) coachSt.favs = [];
  if (coachSt.dia !== diaNum()) { coachSt.dia = diaNum(); coachSt.off = 0; }
  let coachFavsAbertas = false;
  const salvaCoach = () => store.set('jarvis:coach', coachSt);
  const coachIdx = () => (((diaNum() * PASSO + (coachSt.off || 0)) % COACH.length) + COACH.length) % COACH.length;

  function renderCoach() {
    if (coachSt.dia !== diaNum()) { coachSt.dia = diaNum(); coachSt.off = 0; salvaCoach(); }
    const [cat, frase, pratica] = COACH[coachIdx()];
    const salva = coachSt.favs.includes(frase);
    const hoje = (coachSt.off || 0) === 0;
    const favs = coachSt.favs.map((f, i) => `<div class="coach-fav-item"><span>${esc(f)}</span><button data-coach="rm" data-i="${i}" aria-label="Remover dos salvos">Remover</button></div>`).join('');
    $('#coach').innerHTML = `<div class="coach">
      <div class="coach-topo"><span class="coach-cat">${esc(cat)}</span><span class="coach-data">${hoje ? 'Ensinamento de hoje' : 'Mais um'}</span></div>
      <p class="coach-frase">${esc(frase)}</p>
      <p class="coach-pratica"><b>Pense nisso</b>${esc(pratica)}</p>
      <div class="coach-acoes">
        <button data-coach="fav" aria-pressed="${salva}">${salva ? 'Salva' : 'Salvar'}</button>
        <button data-coach="copiar" id="coach-copiar">Copiar</button>
        <button data-coach="outra" class="principal">Outra</button>
      </div>
      ${coachSt.favs.length ? `<div class="coach-favs"><button data-coach="favs">${coachFavsAbertas ? 'Ocultar' : 'Ver'} salvas (${coachSt.favs.length})</button>${coachFavsAbertas ? `<div class="coach-fav-lista">${favs}</div>` : ''}</div>` : ''}
    </div>`;
  }

  function acaoCoach(btn) {
    const a = btn.dataset.coach;
    const [, frase, pratica] = COACH[coachIdx()];
    if (a === 'outra') { coachSt.off = (coachSt.off || 0) + 1; salvaCoach(); renderCoach(); return; }
    if (a === 'fav') {
      const i = coachSt.favs.indexOf(frase);
      if (i >= 0) coachSt.favs.splice(i, 1); else coachSt.favs.unshift(frase);
      salvaCoach(); renderCoach(); return;
    }
    if (a === 'favs') { coachFavsAbertas = !coachFavsAbertas; renderCoach(); return; }
    if (a === 'rm') { coachSt.favs.splice(+btn.dataset.i, 1); salvaCoach(); renderCoach(); return; }
    if (a === 'copiar') {
      const texto = frase + '\n\n' + pratica;
      const ok = () => { btn.textContent = 'Copiado'; setTimeout(() => { btn.textContent = 'Copiar'; }, 1500); };
      const falha = () => { btn.textContent = 'Não copiou'; setTimeout(() => { btn.textContent = 'Copiar'; }, 1500); };
      try { navigator.clipboard.writeText(texto).then(ok, falha); } catch { falha(); }
    }
  }

  /* ---------------------------- eventos --------------------------- */
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-coach]');
    if (c) { acaoCoach(c); return; }
    const a = e.target.closest('[data-aba]');
    if (a) { aba = a.dataset.aba; store.set('jarvis:aba', aba); renderAbas(); renderNoticias(); return; }
    const m = e.target.closest('[data-par]');
    if (m) { moedaSel = m.dataset.par; store.set('jarvis:moeda', moedaSel); renderMoedas(); desenhar(); carregarGrafico(); return; }
    const p = e.target.closest('[data-dias]');
    if (p) { dias = +p.dataset.dias; store.set('jarvis:dias', dias); desenhar(); carregarGrafico(); return; }
    if (e.target.closest('[data-act="reload"]')) carregar();
  });
  $('#orb').addEventListener('click', carregar);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    render();
    if (Date.now() - dados.t > CFG.staleMin * 60000) carregar();
  });

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  render();
  desenhar();
  carregarGrafico();
  if (Date.now() - dados.t > 2 * 60000) carregar();
})();
</script>
</body>
</html>
